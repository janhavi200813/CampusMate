<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignments - CampusMate</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="logo">CampusMate</div>

        <nav>
            <a href="index.html">Dashboard</a>
            <a href="timetable.html">Timetable</a>
            <a href="assignments.html" class="active">Assignments</a>
            <a href="notes.html">Notes</a>
            <a href="goals.html">Goals</a>
        </nav>

        <div class="profile">J</div>
    </header>


    <main>

        <section class="welcome assignment-heading">
            <div>
                <p class="small-text">STAY ON TRACK</p>
                <h1>Assignments 📝</h1>
                <p>Keep track of your college work and deadlines.</p>
            </div>

            <button class="add-button" onclick="showForm()">+ Add Assignment</button>
        </section>

        <div id="assignment-form" class="assignment-form">
            <h2>Add New Assignment</h2>
            <input type="text" id="subject" placeholder="Subject">
            <input type="text" id="title" placeholder="Assignment title">
            <input type="date" id="due-date">
            <div>
                <button onclick="addAssignment()" class="save-button">Add Assignment</button>
                <button onclick="hideForm()" class="cancel-button">Cancel</button>
            </div>
        </div>

        <section class="assignment-list" id="assignment-list"></section>

        <section class="assignment-summary">
            <div>
                <strong id="pending-count">0</strong>
                <span>Pending</span>
            </div>
            <div>
                <strong id="completed-count">0</strong>
                <span>Completed</span>
            </div>
        </section>

    </main>

    <script src="script.js"></script>
    <script>showAssignments();</script>
</body>
</html>
