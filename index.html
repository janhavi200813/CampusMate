<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusMate</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="logo">CampusMate</div>

        <nav>
            <a href="index.html" class="active">Dashboard</a>
            <a href="timetable.html">Timetable</a>
            <a href="assignments.html">Assignments</a>
            <a href="notes.html">Notes</a>
            <a href="goals.html">Goals</a>
        </nav>

        <div class="profile">J</div>
    </header>


    <main>

        <section class="welcome">
            <p class="small-text">WELCOME 👋</p>
            <h1>Welcome back, Janhavi!</h1>
            <p>Here's what's happening with your college life today.</p>
        </section>


        <section class="stats">

            <div class="stat-card">
                <span>📅</span>
                <h3 id="classes-count">0</h3>
                <p>Classes Today</p>
            </div>

            <div class="stat-card">
                <span>📝</span>
                <h3 id="pending-count">0</h3>
                <p>Pending Assignments</p>
            </div>

            <div class="stat-card">
                <span>🎯</span>
                <h3 id="progress-count">0%</h3>
                <p>Goals Completed</p>
            </div>

        </section>


        <section class="content">

            <div class="card">
                <div class="card-header">
                    <h2>📅 Today's Classes</h2>
                    <a href="timetable.html">View all</a>
                </div>
                <div id="today-classes"></div>
            </div>

            <div class="card">
                <div class="card-header">
                    <h2>📝 Assignments</h2>
                    <a href="assignments.html">View all</a>
                </div>
                <div id="dash-assignments"></div>
            </div>

        </section>


        <section class="card goals">
            <div class="card-header">
                <h2>🎯 Goals</h2>
                <a href="goals.html">Manage goals</a>
            </div>
            <div id="dash-goals"></div>
        </section>

    </main>

    <script src="script.js"></script>
    <script>showDashboard();</script>
</body>
</html>
