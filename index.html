<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusMate</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header id="header"></header>

    <main>

        <section class="welcome">
            <p class="small-text" id="greeting"></p>
            <h1 id="welcome-name"></h1>
            <p>Here's what's happening with your college life today.</p>
        </section>

        <a class="alert" id="overdue-alert" href="assignments.html#overdue"></a>

        <section class="next-class" id="next-class"></section>

        <section class="stats">
            <a class="stat-card" href="timetable.html">
                <span>📅</span>
                <h3 id="classes-count">0</h3>
                <p>Classes Today</p>
            </a>
            <a class="stat-card" href="assignments.html">
                <span>📝</span>
                <h3 id="pending-count">0</h3>
                <p>Pending Assignments</p>
            </a>
            <a class="stat-card" href="goals.html">
                <span>🎯</span>
                <h3 id="progress-count">0%</h3>
                <p>Goals Completed</p>
            </a>
        </section>

        <section class="content">
            <div class="card">
                <div class="card-header">
                    <h2>📅 Today's Classes</h2>
                    <a href="timetable.html">View all</a>
                </div>
                <div id="today-classes"></div>
            </div>

            <div class="card">
                <div class="card-header">
                    <h2>📝 Assignments</h2>
                    <a href="assignments.html">View all</a>
                </div>
                <div id="dash-assignments"></div>
            </div>
        </section>

        <section class="card goals">
            <div class="card-header">
                <h2>🎯 Goals</h2>
                <a href="goals.html">Manage goals</a>
            </div>
            <div class="add-row">
                <input type="text" id="dash-goal-input" placeholder="Add a goal and press Enter" aria-label="New goal"
                       onkeydown="if (event.key === 'Enter') dashAddGoal()">
            </div>
            <div id="dash-goals"></div>
        </section>

    </main>

    <script src="script.js"></script>
    <script>
        renderHeader("dashboard");
        showDashboard();
    </script>
</body>
</html>
