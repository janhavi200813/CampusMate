<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goals - CampusMate</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header id="header"></header>

    <main>

        <section class="welcome">
            <p class="small-text">STAY FOCUSED</p>
            <h1>Goals 🎯</h1>
            <p>Set small goals and tick them off as you finish.</p>
        </section>

        <section class="card" id="goal-card">
            <p class="form-error"></p>
            <div class="add-row">
                <input type="text" id="goal-input" placeholder="Write a goal, e.g. Revise Unit 2" aria-label="New goal"
                       onkeydown="if (event.key === 'Enter') addGoal()">
                <button class="save-button" onclick="addGoal()">Add Goal</button>
            </div>

            <p class="progress-text" id="goal-progress-text"></p>
            <div class="progress">
                <div class="progress-bar" id="goal-progress-bar"></div>
            </div>

            <div id="goal-list"></div>
        </section>

    </main>

    <script src="script.js"></script>
    <script>
        renderHeader("goals");
        showGoals();
    </script>
</body>
</html>
