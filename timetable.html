<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timetable - CampusMate</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header id="header"></header>

    <main>

        <section class="welcome assignment-heading">
            <div>
                <p class="small-text">YOUR WEEK</p>
                <h1>Class Timetable 📅</h1>
                <p>Add or remove classes. Today's column is highlighted.</p>
            </div>
            <button class="add-button" onclick="toggleForm('class-form', true)">+ Add Class</button>
        </section>

        <div id="class-form" class="form-card">
            <h2>Add New Class</h2>
            <p class="form-error"></p>
            <label class="label-small" for="class-day">Day</label>
            <select id="class-day">
                <option>Monday</option>
                <option>Tuesday</option>
                <option>Wednesday</option>
                <option>Thursday</option>
                <option>Friday</option>
            </select>
            <label class="label-small" for="class-time">Start time</label>
            <input type="time" id="class-time">
            <label class="label-small" for="class-subject">Subject</label>
            <input type="text" id="class-subject" placeholder="e.g. Digital Logic">
            <label class="label-small" for="class-room">Room / Lab</label>
            <input type="text" id="class-room" placeholder="e.g. Room 202">
            <button class="save-button" onclick="addClass()">Add Class</button>
            <button class="cancel-button" onclick="toggleForm('class-form', false)">Cancel</button>
        </div>

        <section class="weekly-timetable" id="timetable"></section>

    </main>

    <script src="script.js"></script>
    <script>
        renderHeader("timetable");
        showTimetable();
    </script>
</body>
</html>
