<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes - CampusMate</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header id="header"></header>

    <main>

        <section class="welcome">
            <p class="small-text">WRITE IT DOWN</p>
            <h1>Notes 🗒️</h1>
            <p>Keep quick study notes in one place.</p>
        </section>

        <section class="card note-form" id="note-form">
            <p class="form-error"></p>
            <label class="label-small" for="note-title">Title</label>
            <input type="text" id="note-title" placeholder="e.g. Set theory formulas">
            <label class="label-small" for="note-text">Note</label>
            <textarea id="note-text" placeholder="Write your note here... (Ctrl+Enter to save)"></textarea>
            <button class="save-button" onclick="addNote()">Save Note</button>
        </section>

        <input type="text" class="search-box" placeholder="Search notes..." aria-label="Search notes" oninput="searchNotes(this.value)" style="margin-top:20px;max-width:320px">

        <section class="notes-grid" id="note-list"></section>

    </main>

    <script src="script.js"></script>
    <script>
        renderHeader("notes");
        showNotes();
    </script>
</body>
</html>
